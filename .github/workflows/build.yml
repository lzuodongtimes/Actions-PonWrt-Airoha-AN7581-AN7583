name: Build PonWrt for AN7581 (XG-040G-MF)

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /opt/pipx /root/.cache
          docker system prune -af --volumes || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler flex g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone pbs05/ponwrt and check MF config
        run: |
          git clone --depth=1 https://github.com/pbs05/ponwrt.git ponwrt
          rm -rf ponwrt/.git
          ls -la ponwrt/configs || true

      - name: Update and install feeds
        run: |
          cd ponwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          git clone --depth=1 https://github.com/eamonxg/luci-theme-aurora.git package/luci-theme-aurora
          rm -rf package/luci-theme-aurora/.git
          df -h

      - name: Apply an7581.config with Chinese and Aurora theme for XG-040G-MF
        run: |
          cd ponwrt
          cp configs/an7581.config .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-aurora=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-aurora-zh-cn=y" >> .config
          make defconfig
          mkdir -p files/etc/config
          cat << 'EOF' > files/etc/config/luci
          config core main
          	option lang 'zh_cn'
          	option mediaurlbase '/luci-static/aurora'
          EOF

      - name: Download sources and compile firmware
        run: |
          cd ponwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \; || true
          make -j$(nproc) || make target/linux/install -j1 V=s
          rm -rf dl/*
          df -h

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-an7581-xg-040g-mf
          path: ponwrt/bin/targets/airoha/an7581/*
          if-no-files-found: warn

      - name: Release firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mf-v${{ github.run_number }}
          name: PonWrt AN7581 (XG-040G-MF) Build #${{ github.run_number }}
          files: |
            ponwrt/bin/targets/airoha/an7581/*-sysupgrade.bin
            ponwrt/bin/targets/airoha/an7581/*.itb
            ponwrt/bin/targets/airoha/an7581/sha256sums
          fail_on_unmatched_files: false
