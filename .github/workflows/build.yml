name: Build PonWrt for XG-040G-MD / XG-040G-MF

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-md-mf.yml'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  check-upstream:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      configs: ${{ steps.check.outputs.configs }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
      - name: Check pbs05/ponwrt updates and scan configs
        id: check
        run: |
          UPSTREAM_SHA=$(git ls-remote https://github.com/pbs05/ponwrt.git HEAD | awk '{print $1}')
          echo "Latest pbs05/ponwrt HEAD: $UPSTREAM_SHA"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

          LAST_SHA=$(gh release list --repo "${{ github.repository }}" --limit 10 --json tagName,body \
            | jq -r '.[] | select(.tagName | startswith("ponwrt-all-")) | .body' \
            | grep -oE 'upstream_sha:[[:space:]]*[0-9a-f]{40}' | head -n1 | awk '{print $2}' || true)
          echo "Last built upstream SHA: ${LAST_SHA:-none}"

          if [ "${{ github.event_name }}" != "schedule" ] || [ -z "$LAST_SHA" ] || [ "$UPSTREAM_SHA" != "$LAST_SHA" ]; then
            SHOULD_BUILD="true"
          else
            SHOULD_BUILD="false"
          fi
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

          if [ "$SHOULD_BUILD" = "true" ]; then
            git clone --depth=1 https://github.com/pbs05/ponwrt.git /tmp/check-ponwrt
            # 只保留带完整 target 的整机配置（an7581 / an7583）；
            # release.config 只是几个包的追加片段，没有 CONFIG_TARGET_*，单独编会退到默认
            # mediatek/filogic 目标，内核 kconfig 交互提问直接失败
            ALLOWED="an7581 an7583"
            KEEP=""
            for c in $ALLOWED; do
              f="/tmp/check-ponwrt/configs/$c.config"
              if [ -f "$f" ] && grep -q "^CONFIG_TARGET_air" "$f"; then
                KEEP="$KEEP $c"
              fi
            done
            CONFIG_LIST=$(echo $KEEP | tr ' ' '\n' | jq -R -s -c 'split("\n") | map(select(length > 0))')
            rm -rf /tmp/check-ponwrt
            echo "Detected configs: $CONFIG_LIST"
            echo "configs=$CONFIG_LIST" >> "$GITHUB_OUTPUT"
          else
            echo "No upstream changes detected. Skipping firmware build."
            echo "configs=[]" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: check-upstream
    if: ${{ needs.check-upstream.outputs.should_build == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config_name: ${{ fromJson(needs.check-upstream.outputs.configs) }}
    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4

      - name: Free up disk space before build
        run: |
          # 只删 runner 预装的、编译用不到的组件，不动编译工具链
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /opt/pipx /usr/share/swift /usr/share/miniconda \
            /root/.cache /tmp/* /var/tmp/* || true
          sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*
          docker system prune -af --volumes || true
          df -h / /mnt 2>/dev/null || df -h

          FREE_GB=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Free on /: ${FREE_GB}G"
          if [ "${FREE_GB:-0}" -lt 20 ]; then
            echo "::warning::磁盘可用空间不足 20G，再清一轮"
            sudo rm -rf /usr/local/go /usr/local/.ghcup /opt/microsoft /usr/local/share/powershell || true
            sudo rm -rf /tmp/* /var/tmp/* || true
            sudo apt-get clean
            df -h /
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler flex g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget jq
          sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*

      - name: Clone pbs05/ponwrt and Aurora theme
        run: |
          # 保留 .git：version.mk 依赖 git describe 生成版本号，删掉会让 base-files 变成 xxx-unknown
          git clone --depth=1 https://github.com/pbs05/ponwrt.git /tmp/pw
          git -C /tmp/pw tag -f v0.0.0-build 2>/dev/null || true
          git -C /tmp/pw describe --tags --always

          # luci-theme-aurora：仓库内已带编译好的静态资源，直接当本地 package 用，无需 npm 构建
          git clone --depth=1 https://github.com/eamonxg/luci-theme-aurora.git /tmp/pw/package/luci-theme-aurora
          rm -rf /tmp/pw/package/luci-theme-aurora/.git

      - name: Update and install feeds
        run: |
          cd /tmp/pw
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply ${{ matrix.config_name }}.config with Aurora theme
        run: |
          cd /tmp/pw
          cp "configs/${{ matrix.config_name }}.config" .config
          # 源码默认选的是 Argon，这里换成 Aurora
          sed -i 's/^CONFIG_PACKAGE_luci-theme-argon=y/# CONFIG_PACKAGE_luci-theme-argon is not set/' .config
          grep -q "CONFIG_PACKAGE_luci-theme-aurora" .config || echo "CONFIG_PACKAGE_luci-theme-aurora=y" >> .config

          # ---- 固件级：默认开启硬件流量卸载 ----
          # 1) 源码 defaults 只设了软件 flow_offloading=1，这里把硬件卸载也设为默认开启
          FW_CONF=/tmp/pw/package/network/config/firewall/files/firewall.config
          if [ -f "$FW_CONF" ] && ! grep -q "option flow_offloading_hw" "$FW_CONF"; then
            sed -i '/^config defaults/,/^config zone/ s|^\(\toption flow_offloading\s*1\)$|\1\n\toption flow_offloading_hw\t1|' "$FW_CONF"
          fi

          # 2) 内核开关只动 NF_DEFRAG_IPV4；CONFIG_BRIDGE_NETFILTER 刻意保持关闭
          #    QEMU 实测：BRIDGE_NETFILTER=n 的内核里 675-02 照样剥 PPPoE、照样
          #    让 meta l4proto 命中，所以根本不需要 br_netfilter。
          #    反过来 br_netfilter 一旦加载，被翻转成 0x0800 的 PPPoE 帧会被它
          #    抢进 IP 层，桥转发的包凭空消失（QEMU 里 forward counter 从 1 变 0），
          #    属于必须避免的组合，因此内核不编这块、kmod-br-netfilter 也不选。
          #    只改 target/linux/generic/config-6.18：
          #    顶层 .config 只装包/目标选项，写进去会被后面的 make defconfig 丢掉。
          KCONF=/tmp/pw/target/linux/generic/config-6.18
          sed -i 's/^# CONFIG_NF_DEFRAG_IPV4 is not set$/CONFIG_NF_DEFRAG_IPV4=y/' "$KCONF"
          grep -q "^CONFIG_NF_DEFRAG_IPV4=y" "$KCONF" || echo "CONFIG_NF_DEFRAG_IPV4=y" >> "$KCONF"
          grep -E "^CONFIG_NF_DEFRAG_IPV4=y" "$KCONF"
          # 4) 真正的阻塞点：bridge 家族里 nft 解析不出内层 L4
          #    PPPoE 帧进 bridge 时 skb->protocol = ETH_P_PPP_SES，nft 在 bridge
          #    家族拿不到 ip/tcp，`meta l4proto { tcp, udp }` 永不命中（实测无条件
          #    counter 19 万包、l4proto counter 恒为 0），flow add 自然永不执行。
          #    675-02 的 nf_ct_bridge_inner() 已经剥掉 PPPoE 头并把 network header
          #    指到内层 IP，只差 skb->protocol 没改；这里在解析成功后改成内层协议，
          #    让 nft 解析链算出 ip->tcp 与 thoff（thoff 为 0 时 675-09 会直接跳过）。
          KONGPATCH=/tmp/pw/target/linux/generic/pending-6.18/675-02-netfilter-bridge-Add-conntrack-double-vlan-and-pppoe.patch
          python3 - "$KONGPATCH" <<'PY'
          import re, sys
          path = sys.argv[1]
          s = open(path).read()
          old = ('+\tif (offset && ret == NF_ACCEPT)\n'
                 '+\t\tskb_reset_network_header(skb);\n')
          new = ('+\tif (offset) {\n'
                 '+\t\tif (offset == PPPOE_SES_HLEN && ret == NF_ACCEPT)\n'
                 '+\t\t\tskb->protocol = proto;\n'
                 '+\t\telse\n'
                 '+\t\t\tskb_reset_network_header(skb);\n'
                 '+\t}\n')
          if 'skb->protocol = proto;' in s:
              print('kernel flip already present, skip'); sys.exit(0)
          assert s.count(old) == 1, 'anchor not unique'
          s = s.replace(old, new)
          lines = s.split('\n'); out = []; i = 0; shift = 0
          while i < len(lines):
              l = lines[i]
              if l.startswith('--- a/'):
                  shift = 0
              m = re.match(r'^@@ -(\d+),(\d+) \+(\d+),(\d+) @@(.*)$', l)
              if not m:
                  out.append(l); i += 1; continue
              os_, oc, ns, nc, tail = (int(m.group(1)), int(m.group(2)),
                                       int(m.group(3)), int(m.group(4)), m.group(5))
              body = []; i += 1
              while i < len(lines):
                  b = lines[i]
                  if b.startswith('@@ ') or b.startswith('diff ') or b.startswith('--- a/') or b.startswith('+++ b/'):
                      break
                  if b[:1] in (' ', '-', '+') or b == '':
                      body.append(b); i += 1; continue
                  break
              ro = sum(1 for b in body if b[:1] in (' ', '-'))
              rn = sum(1 for b in body if b[:1] in (' ', '+'))
              out.append('@@ -%d,%d +%d,%d @@%s' % (os_, ro, ns + shift, rn, tail))
              out.extend(body)
              shift += rn - nc
          open(path, 'w').write('\n'.join(out))
          print('OK: 675-02 patched (skb->protocol flip)')
          PY
          grep -q 'skb->protocol = proto;' "$KONGPATCH" || { echo "内核 patch 注入失败"; exit 1; }
          # 5) 最后一环：bridge 家族的 nft 入口按 eth_hdr(skb)->h_proto 判协议，
          #    PPPoE 帧这里恒为 0x8864，即便 675-02 把 skb->protocol 改成内层 IP，
          #    nft 仍会落到 unspec，meta l4proto / flow offload 还是不执行。
          #    这里补一个独立小补丁：eth 头不是 IP/IPv6 时，按 skb->protocol 再判一次。
          PATCHDIR=/tmp/pw/target/linux/generic/pending-6.18
          BRPATCH="$PATCHDIR/675-02b-nft-bridge-parse-inner-protocol.patch"
          cat > "$BRPATCH" <<'EOF'
          --- a/net/netfilter/nft_chain_filter.c
          +++ b/net/netfilter/nft_chain_filter.c
          @@ -244,6 +244,25 @@
           		nft_set_pktinfo_ipv6_validate(&pkt);
           		break;
           	default:
          +		/* 只处理被 675-02 剥掉 PPPoE 外壳、skb->protocol 已换成内层协议
          +		 * 的帧：此时 eth 头仍是 0x8864，直接走 unspec 就永远匹配不到
          +		 * meta l4proto / flow offload。其它封装（VLAN 等）行为保持不变。
          +		 */
          +		if (eth_hdr(skb)->h_proto == htons(ETH_P_PPP_SES) &&
          +		    skb->protocol != eth_hdr(skb)->h_proto) {
          +			switch (skb->protocol) {
          +			case htons(ETH_P_IP):
          +				nft_set_pktinfo_ipv4_validate(&pkt);
          +				break;
          +			case htons(ETH_P_IPV6):
          +				nft_set_pktinfo_ipv6_validate(&pkt);
          +				break;
          +			default:
          +				nft_set_pktinfo_unspec(&pkt);
          +				break;
          +			}
          +			break;
          +		}
           		nft_set_pktinfo_unspec(&pkt);
           		break;
           	}
          EOF
          [ -s "$BRPATCH" ] || { echo "bridge patch 写入失败"; exit 1; }
          grep -q "skb->protocol != eth_hdr(skb)->h_proto" "$BRPATCH" || { echo "bridge patch 内容异常"; exit 1; }

          # 3) 桥接 PPPoE 光有内核开关还不够：675-02 的 nf_ct_bridge_inner()
          #    只在“已存在非默认 zone 的 ct 模板”时才去剥 VLAN/PPPoE 头，
          #    zone 是默认值时 PPPoE 帧被标成 IP_CT_UNTRACKED，流表照样是空的。
          #    所以在 fw4 生成的 bridge 表里加一条 prerouting 链设 zone；
          #    优先级 -450 早于内核 nf_conntrack_bridge 的 hook，才能被它看到。
          FWPATCH=/tmp/pw/package/network/config/firewall4/patches/001-add-bridge-flowtable-support.patch
          python3 - "$FWPATCH" <<'PY'
          import re, sys
          path = sys.argv[1]
          s = open(path).read()
          if 'ct zone set 3130' in s:
              print('zone rule already present, skip')
              sys.exit(0)
          anchor = '+\tchain forward {\n'
          assert s.count(anchor) == 1, 'anchor not unique'
          add = ('+\n'
                 '+\tchain prerouting {\n'
                 '+\t\ttype filter hook prerouting priority -450; policy accept;\n'
                 '+\t\tiifname { "lan1", "pon0" } ct zone set 3130\n'
                 '+\t}\n'
                 '+\n')
          n_add = add.count('+')
          s = s.replace(anchor, add + anchor)
          lines = s.split('\n')

          def hunks_of(lines):
              out = []
              i = 0
              while i < len(lines):
                  m = re.match(r'^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@', lines[i])
                  if not m:
                      i += 1; continue
                  exp_old = int(m.group(2) if m.group(2) is not None else 1)
                  exp_new = int(m.group(4) if m.group(4) is not None else 1)
                  j = i + 1; old = new = 0
                  while j < len(lines) and (old < exp_old or new < exp_new):
                      l = lines[j]
                      if l.startswith('\\'):
                          j += 1; continue
                      if l.startswith(' ') or l.startswith('-'):
                          old += 1
                      if l.startswith(' ') or l.startswith('+'):
                          new += 1
                      j += 1
                  out.append([i, m, old, new, j])
                  i = j
              return out

          hs = hunks_of(lines)
          target = None
          for k, h in enumerate(hs):
              if any(anchor.strip('+').strip() in lines[x] for x in range(h[0], h[4])):
                  target = k; break
          assert target is not None, 'hunk containing anchor not found'
          m = hs[target][1]
          newnew = int(m.group(4) if m.group(4) is not None else 1) + n_add
          lines[hs[target][0]] = re.sub(r'^(@@ -\d+(?:,\d+)? \+\d+,)\d+( @@.*)$',
                                        lambda mm: mm.group(1) + str(newnew) + mm.group(2),
                                        lines[hs[target][0]])
          s = '\n'.join(lines)
          hs2 = hunks_of(s.split('\n'))
          for h in hs2:
              exp_old = int(h[1].group(2) if h[1].group(2) is not None else 1)
              exp_new = int(h[1].group(4) if h[1].group(4) is not None else 1)
              if (h[2], h[3]) != (exp_old, exp_new):
                  print('MISMATCH', h[1].group(0), h[2], h[3]); sys.exit(1)
          open(path, 'w').write(s)
          print(f'OK: +{n_add} lines, hunks={len(hs2)}, all counts consistent')
          PY
          grep -q 'ct zone set 3130' "$FWPATCH" || { echo "fw4 patch 注入失败"; exit 1; }


          # md 也导出 preloader / bl31-uboot 文件（源码默认只给 mf 声明了 ARTIFACTS）
          sed -i '/^define Device\/nokia_xg-040g-md-ubi-images/,/^endef/{/^endef/{s|^endef|  ARTIFACT/preloader.bin := an7581-preloader nokia_xg-040g-md\n  ARTIFACT/bl31-uboot.fip := an7581-bl31-uboot nokia_xg-040g-md\n  ARTIFACTS := preloader.bin bl31-uboot.fip\nendef|}}' /tmp/pw/target/linux/airoha/image/an7581.mk

          # 只保留 xg-040g-md（an7581 目标）和 xg-040g-mf（an7583 目标）两个设备
          case "${{ matrix.config_name }}" in
            an7581)
              TARGET=airoha_an7581
              DEVICES="nokia_xg-040g-md-ubi nokia_xg-040g-md-ubi-usb-sfp"
              ;;
            an7583)
              TARGET=airoha_an7583
              DEVICES="nokia_xg-040g-mf nokia_xg-040g-mf-ubi"
              ;;
            *)
              TARGET=""
              DEVICES=""
              ;;
          esac
          if [ -n "$DEVICES" ]; then
            grep -vE "^CONFIG_TARGET_DEVICE_${TARGET}_DEVICE_" .config > .config.tmp
            grep -vE "^CONFIG_TARGET_DEVICE_PACKAGES_${TARGET}_DEVICE_" .config.tmp > .config
            rm -f .config.tmp
            for d in $DEVICES; do
              echo "CONFIG_TARGET_DEVICE_${TARGET}_DEVICE_${d}=y" >> .config
              echo "CONFIG_TARGET_DEVICE_PACKAGES_${TARGET}_DEVICE_${d}=\"\"" >> .config
            done
          fi
          # 去掉 LuCI 自带的「插件」页面（luci-mod-system 的 Plugins 菜单与视图）
          LUCI_SYS=/tmp/pw/feeds/luci/modules/luci-mod-system
          if [ -f "$LUCI_SYS/root/usr/share/luci/menu.d/luci-mod-system.json" ]; then
            python3 -c "import json;p='$LUCI_SYS/root/usr/share/luci/menu.d/luci-mod-system.json';d=json.load(open(p));d.pop('admin/system/plugins',None);json.dump(d,open(p,'w'),indent=2,ensure_ascii=False)"
            rm -f "$LUCI_SYS/htdocs/luci-static/resources/view/system/plugins.js"
            echo "LuCI 插件页面已移除"
          fi

          # 去掉 LuCI 的「交换机 VLAN 配置」菜单（只删菜单项，保留视图文件，避免其它页面引用时加载失败）
          LUCI_NET=/tmp/pw/feeds/luci/modules/luci-mod-network
          if [ -f "$LUCI_NET/root/usr/share/luci/menu.d/luci-mod-network.json" ]; then
            python3 -c "import json;p='$LUCI_NET/root/usr/share/luci/menu.d/luci-mod-network.json';d=json.load(open(p));[d.pop(k,None) for k in ('admin/network/switch','admin/network/switch-vlan')];json.dump(d,open(p,'w'),indent=2,ensure_ascii=False)"
            echo "已移除交换机 VLAN 菜单"
          fi

          # 上游 feed 里 fkwnopd / luci-app-fkwnopd 的 Config.in 互相 select / depends，
          # kconfig 会报 recursive dependency detected 让整个 defconfig 失败；
          # 这两个包跟固件毫无关系，删目录后重新生成 kconfig 元数据即可
          find /tmp/pw/feeds /tmp/pw/package/feeds -maxdepth 5 -name "*fkwnopd*" -exec rm -rf {} + 2>/dev/null || true
          rm -rf /tmp/pw/tmp/.config-package.in /tmp/pw/tmp/.packageinfo

          # 桥接 conntrack 模块必须真的装进固件：an7583 的 DEFAULT_PACKAGES 里
          # 没有 kmod-nf-conntrack-bridge（只有 an7581 有），缺了它 ct zone 只建
          # 模板、没有 hook 去剥 PPPoE 头，flow offload 会安静地不生效。
          # an7581 本来就有，这里统一补一遍，幂等。
          echo "CONFIG_PACKAGE_kmod-nf-conntrack-bridge=y" >> .config
          echo "# CONFIG_PACKAGE_kmod-br-netfilter is not set" >> .config

          make defconfig
          grep -q "^CONFIG_PACKAGE_kmod-nf-conntrack-bridge=y" .config || { echo "::error::kmod-nf-conntrack-bridge 未被选中"; exit 1; }
          if grep -q "^CONFIG_PACKAGE_kmod-br-netfilter=y" .config; then
            echo "::error::kmod-br-netfilter 被选中，它会抢走翻转协议的 PPPoE 帧"; exit 1
          fi
          grep -E "^CONFIG_TARGET_DEVICE_airoha_an758[13]_DEVICE_.*=y" .config
          grep -E "^CONFIG_LUCI_LANG_zh_Hans=|^CONFIG_PACKAGE_luci-theme-" .config


      - name: Download sources, compile, collect outputs, and clean all junk
        run: |
          cd /tmp/pw
          make download -j8
          find dl -size -1024c -exec rm -f {} \; || true
          make -j$(nproc) || yes "" | make -j1 V=s

          # 源码默认前缀来自 VERSION_DIST=PonWrt，产物是 ponwrt-*，这里改名成 immortalwrt-*
          find bin/targets -type f -name "ponwrt-*" | while read -r f; do
            dir=$(dirname "$f")
            base=$(basename "$f")
            new_base="${base/#ponwrt/immortalwrt}"
            mv "$f" "$dir/$new_base"
          done
          # 目录里的 sha256sums 同步改文件名（文件内容没变，校验值仍然有效）
          find bin/targets -name sha256sums -type f | while read -r s; do
            sed -i 's/ponwrt-/immortalwrt-/g' "$s"
          done

          mkdir -p "${{ github.workspace }}/release-files/${{ matrix.config_name }}"
          find bin/targets -type f \( -name "*.bin" -o -name "*.itb" -o -name "*.fip" -o -name "sha256sums" \) \
            -exec cp {} "${{ github.workspace }}/release-files/${{ matrix.config_name }}/" \;

          # 只清本次编译产生的中间产物
          rm -rf build_dir/ staging_dir/ logs/ bin/ dl/ tmp/ .config.old 2>/dev/null || true
          rm -rf /tmp/pw /var/tmp/*
          ls -la "${{ github.workspace }}/release-files/${{ matrix.config_name }}"
          df -h

      - name: Verify patched kernel is really in the build tree
        run: |
          cd /tmp/pw
          KDIR=$(find build_dir -maxdepth 4 -type d -name "linux-6.18.60" | head -1)
          [ -n "$KDIR" ] || { echo "::error::找不到 linux-6.18.60 构建目录"; exit 1; }
          echo "内核目录: $KDIR"
          grep -q "offset == PPPOE_SES_HLEN && ret == NF_ACCEPT" "$KDIR/net/bridge/netfilter/nf_conntrack_bridge.c" \
            || { echo "::error::675-02 的 skb->protocol 翻转没有进入内核源码树"; exit 1; }
          grep -q "eth_hdr(skb)->h_proto == htons(ETH_P_PPP_SES)" "$KDIR/net/netfilter/nft_chain_filter.c" \
            || { echo "::error::bridge 解析补丁没有进入内核源码树"; exit 1; }
          if grep -q "^CONFIG_BRIDGE_NETFILTER=" "$KDIR/.config"; then
            echo "::error::CONFIG_BRIDGE_NETFILTER 被启用（br_netfilter 会抢走翻转协议的 PPPoE 帧）"; exit 1
          fi
          grep -Eq "^CONFIG_NF_CONNTRACK_ZONES=y$" "$KDIR/.config" || { echo "::error::CONFIG_NF_CONNTRACK_ZONES 未生效（ct zone set 会失败）"; exit 1; }
          grep -Eq "^CONFIG_NF_CONNTRACK_BRIDGE=[my]$" "$KDIR/.config" || { echo "::error::CONFIG_NF_CONNTRACK_BRIDGE 未生效"; exit 1; }
          grep -Eq "^CONFIG_NF_DEFRAG_IPV4=[my]$" "$KDIR/.config" || { echo "::error::CONFIG_NF_DEFRAG_IPV4 未生效"; exit 1; }
          grep -Eq "^CONFIG_NF_TABLES_BRIDGE=" "$KDIR/.config" || echo "::warning::NF_TABLES_BRIDGE 未在 config 中出现"
          ls -l "$KDIR/net/netfilter/nft_chain_filter.o" "$KDIR/net/bridge/netfilter/nf_conntrack_bridge.o" 2>/dev/null || true
          echo "内核补丁与开关校验通过"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ matrix.config_name }}
          path: release-files/${{ matrix.config_name }}/*
          if-no-files-found: warn

  release:
    needs: [check-upstream, build]
    if: always() && needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Collect release files without config prefix
        run: |
          mkdir -p final-release
          for dir in all-artifacts/ponwrt-*; do
            [ -d "$dir" ] || continue
            cfg=$(basename "$dir" | sed 's/^ponwrt-//')
            for f in "$dir"/*; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              if [ "$base" = "sha256sums" ]; then
                cp "$f" "final-release/${cfg}-sha256sums"
              else
                cp "$f" "final-release/$base"
              fi
            done
          done
          ls -la final-release

      - name: Release all hardware firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ponwrt-all-v${{ github.run_number }}
          name: PonWrt All Supported Hardware Build #${{ github.run_number }}
          body: |
            Automated build for pbs05/ponwrt
            upstream_sha: ${{ needs.check-upstream.outputs.upstream_sha }}
          files: final-release/*
          fail-on-unmatched-files: false

      - name: Clean release staging directories
        if: always()
        run: |
          rm -rf all-artifacts final-release || true
          df -h
