name: Build PonWrt for All Supported Hardware (author source, unmodified kernel)

on:
  workflow_dispatch: {}

concurrency:
  group: ponwrt-all-stock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-upstream:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      configs: ${{ steps.check.outputs.configs }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
      - name: Check pbs05/ponwrt updates and scan configs
        id: check
        run: |
          UPSTREAM_SHA=$(git ls-remote https://github.com/pbs05/ponwrt.git HEAD | awk '{print $1}')
          echo "Latest pbs05/ponwrt HEAD: $UPSTREAM_SHA"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

          LAST_SHA=$(gh release list --repo "${{ github.repository }}" --limit 10 --json tagName,body \
            | jq -r '.[] | select(.tagName | startswith("ponwrt-stock-")) | .body' \
            | grep -oE 'upstream_sha:[[:space:]]*[0-9a-f]{40}' | head -n1 | awk '{print $2}' || true)
          echo "Last built upstream SHA: ${LAST_SHA:-none}"

          if [ "${{ github.event_name }}" != "schedule" ] || [ -z "$LAST_SHA" ] || [ "$UPSTREAM_SHA" != "$LAST_SHA" ]; then
            SHOULD_BUILD="true"
          else
            SHOULD_BUILD="false"
          fi
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

          if [ "$SHOULD_BUILD" = "true" ]; then
            git clone --depth=1 https://github.com/pbs05/ponwrt.git /tmp/check-ponwrt
            # 只编 an7581 / an7583 两个整机配置；
            # release.config 只是几个包的追加片段，没有 CONFIG_TARGET_*，
            # 单独编会退到默认 mediatek/filogic 目标，内核 kconfig 交互提问直接失败
            ALLOWED="an7581 an7583"
            KEEP=""
            for c in $ALLOWED; do
              f="/tmp/check-ponwrt/configs/$c.config"
              if [ -f "$f" ] && grep -q "^CONFIG_TARGET_air" "$f"; then
                KEEP="$KEEP $c"
              fi
            done
            CONFIG_LIST=$(echo $KEEP | tr ' ' '\n' | jq -R -s -c 'split("\n") | map(select(length > 0))')
            rm -rf /tmp/check-ponwrt
            echo "Detected configs: $CONFIG_LIST"
            echo "configs=$CONFIG_LIST" >> "$GITHUB_OUTPUT"
          else
            echo "No upstream changes detected. Skipping firmware build."
            echo "configs=[]" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: check-upstream
    if: ${{ needs.check-upstream.outputs.should_build == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config_name: ${{ fromJson(needs.check-upstream.outputs.configs) }}
    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4

      - name: Free up disk space before build
        run: |
          # 只删 runner 预装的、编译用不到的组件，不动编译工具链
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /opt/pipx /usr/share/swift /usr/share/miniconda \
            /root/.cache /tmp/* /var/tmp/* || true
          sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*
          docker system prune -af --volumes || true
          df -h / /mnt 2>/dev/null || df -h

          FREE_GB=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Free on /: ${FREE_GB}G"
          if [ "${FREE_GB:-0}" -lt 20 ]; then
            echo "::warning::磁盘可用空间不足 20G，再清一轮"
            sudo rm -rf /usr/local/go /usr/local/.ghcup /opt/microsoft /usr/local/share/powershell || true
            sudo rm -rf /tmp/* /var/tmp/* || true
            sudo apt-get clean
            df -h /
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler flex g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget jq
          sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*

      - name: Clone pbs05/ponwrt and Aurora theme
        run: |
          # 保留 .git：version.mk 依赖 git describe 生成版本号，删掉会让 base-files 变成 xxx-unknown
          git clone --depth=1 https://github.com/pbs05/ponwrt.git /tmp/pw
          git -C /tmp/pw tag -f v0.0.0-build 2>/dev/null || true
          git -C /tmp/pw describe --tags --always

          # luci-theme-aurora：仓库内已带编译好的静态资源，直接当本地 package 用，无需 npm 构建
          git clone --depth=1 https://github.com/eamonxg/luci-theme-aurora.git /tmp/pw/package/luci-theme-aurora
          rm -rf /tmp/pw/package/luci-theme-aurora/.git

      - name: Export XG-040G-MD preloader/bl31 ARTIFACTS
        run: |
          cd /tmp/pw
          # 源码里 Device/nokia_xg-040g-md-ubi-images 没有声明 ARTIFACTS，
          # 所以 md 产物目录只有 sysupgrade.itb / recovery.itb，没有 preloader.bin 和 bl31-uboot.fip。
          # 这里补三条声明，让 md 也能产出这两个刷写/救砖用的文件。
          # 对应的构建规则源码里已有（Build/an7581-preloader、Build/an7581-bl31-uboot，
          # 走 U-Boot/an7581_nokia_xg-040g-md），不新增任何包。
          python3 - <<'PY'
          p = "target/linux/airoha/image/an7581.mk"
          src = open(p, encoding="utf-8").read()
          mark = "ARTIFACT/preloader.bin := an7581-preloader nokia_xg-040g-md"
          if mark in src:
              print("md ARTIFACTS 已存在，跳过")
          else:
              head = "define Device/nokia_xg-040g-md-ubi-images\n"
              i = src.find(head)
              assert i >= 0, "找不到 md 设备块，an7581.mk 结构可能变了"
              j = src.find("\nendef", i)
              assert j >= 0, "md 设备块缺少 endef"
              add = ("\n  " + mark +
                     "\n  ARTIFACT/bl31-uboot.fip := an7581-bl31-uboot nokia_xg-040g-md" +
                     "\n  ARTIFACTS := preloader.bin bl31-uboot.fip")
              src = src[:j] + add + src[j:]
              open(p, "w", encoding="utf-8").write(src)
              print("md ARTIFACTS 已注入")
          PY
          grep -A20 "^define Device/nokia_xg-040g-md-ubi-images" target/linux/airoha/image/an7581.mk | grep -E "ARTIFACT"
          grep -q "ARTIFACTS := preloader.bin bl31-uboot.fip" target/linux/airoha/image/an7581.mk || {
            echo "::error::md ARTIFACTS 注入后未生效"; exit 1;
          }

      - name: Update and install feeds
        run: |
          cd /tmp/pw
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply ${{ matrix.config_name }}.config with Aurora theme
        run: |
          cd /tmp/pw
          cp "configs/${{ matrix.config_name }}.config" .config
          # 源码默认选的是 Argon，这里换成 Aurora
          sed -i 's/^CONFIG_PACKAGE_luci-theme-argon=y/# CONFIG_PACKAGE_luci-theme-argon is not set/' .config
          grep -q "CONFIG_PACKAGE_luci-theme-aurora" .config || echo "CONFIG_PACKAGE_luci-theme-aurora=y" >> .config

          # 设备列表完全沿用源码 configs/*.config，编译该目标下全部机型

          # 去掉 LuCI 自带的「插件」页面（luci-mod-system 的 Plugins 菜单与视图）
          LUCI_SYS=/tmp/pw/feeds/luci/modules/luci-mod-system
          if [ -f "$LUCI_SYS/root/usr/share/luci/menu.d/luci-mod-system.json" ]; then
            python3 -c "import json;p='$LUCI_SYS/root/usr/share/luci/menu.d/luci-mod-system.json';d=json.load(open(p));d.pop('admin/system/plugins',None);json.dump(d,open(p,'w'),indent=2,ensure_ascii=False)"
            rm -f "$LUCI_SYS/htdocs/luci-static/resources/view/system/plugins.js"
            echo "LuCI 插件页面已移除"
          fi

          # 去掉 LuCI 的「交换机 VLAN 配置」菜单（只删菜单项，保留视图文件，避免其它页面引用时加载失败）
          LUCI_NET=/tmp/pw/feeds/luci/modules/luci-mod-network
          if [ -f "$LUCI_NET/root/usr/share/luci/menu.d/luci-mod-network.json" ]; then
            python3 -c "import json;p='$LUCI_NET/root/usr/share/luci/menu.d/luci-mod-network.json';d=json.load(open(p));[d.pop(k,None) for k in ('admin/network/switch','admin/network/switch-vlan')];json.dump(d,open(p,'w'),indent=2,ensure_ascii=False)"
            echo "已移除交换机 VLAN 菜单"
          fi

          # 上游 feed 里 fkwnopd / luci-app-fkwnopd 的 Config.in 互相 select / depends，
          # kconfig 会报 recursive dependency detected 让整个 defconfig 失败；
          # 这两个包跟固件毫无关系，删目录后重新生成 kconfig 元数据即可
          find /tmp/pw/feeds /tmp/pw/package/feeds -maxdepth 5 -name "*fkwnopd*" -exec rm -rf {} + 2>/dev/null || true
          rm -rf /tmp/pw/tmp/.config-package.in /tmp/pw/tmp/.packageinfo

          make defconfig
          echo "选中的设备："
          grep -E "^CONFIG_TARGET_DEVICE_airoha_an758[13]_DEVICE_.*=y" .config | sed 's/=y//'
          grep -E "^CONFIG_LUCI_LANG_zh_Hans=|^CONFIG_PACKAGE_luci-theme-" .config

      - name: Download sources, compile, collect outputs, and clean all junk
        run: |
          cd /tmp/pw
          make download -j8
          find dl -size -1024c -exec rm -f {} \; || true
          make -j$(nproc) || yes "" | make -j1 V=s

          # 源码默认前缀来自 VERSION_DIST=PonWrt，产物是 ponwrt-*，这里改名成 immortalwrt-*
          find bin/targets -type f -name "ponwrt-*" | while read -r f; do
            dir=$(dirname "$f")
            base=$(basename "$f")
            new_base="${base/#ponwrt/immortalwrt}"
            mv "$f" "$dir/$new_base"
          done
          # 目录里的 sha256sums 同步改文件名（文件内容没变，校验值仍然有效）
          find bin/targets -name sha256sums -type f | while read -r s; do
            sed -i 's/ponwrt-/immortalwrt-/g' "$s"
          done

          mkdir -p "${{ github.workspace }}/release-files/${{ matrix.config_name }}"
          find bin/targets -type f \( -name "*.bin" -o -name "*.itb" -o -name "*.fip" -o -name "sha256sums" \) \
            -exec cp {} "${{ github.workspace }}/release-files/${{ matrix.config_name }}/" \;

          # 只清本次编译产生的中间产物
          rm -rf build_dir/ staging_dir/ logs/ bin/ dl/ tmp/ .config.old 2>/dev/null || true
          rm -rf /tmp/pw /var/tmp/*
          ls -la "${{ github.workspace }}/release-files/${{ matrix.config_name }}"
          df -h

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ matrix.config_name }}
          path: release-files/${{ matrix.config_name }}/*
          if-no-files-found: warn

  release:
    needs: [check-upstream, build]
    if: always() && needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Collect release files without config prefix
        run: |
          mkdir -p final-release
          for dir in all-artifacts/ponwrt-*; do
            [ -d "$dir" ] || continue
            cfg=$(basename "$dir" | sed 's/^ponwrt-//')
            for f in "$dir"/*; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              if [ "$base" = "sha256sums" ]; then
                cp "$f" "final-release/${cfg}-sha256sums"
              else
                cp "$f" "final-release/$base"
              fi
            done
          done
          ls -la final-release

      - name: Release all hardware firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ponwrt-stock-v${{ github.run_number }}
          name: PonWrt All Hardware (author source, unmodified kernel) #${{ github.run_number }}
          body: |
            Automated build for pbs05/ponwrt
            upstream_sha: ${{ needs.check-upstream.outputs.upstream_sha }}
          files: final-release/*
          fail-on-unmatched-files: false

      - name: Clean release staging directories
        if: always()
        run: |
          rm -rf all-artifacts final-release || true
          df -h
