name: Build PonWrt for AN7583 (XG-040G-MF)

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /opt/pipx /root/.cache
          docker system prune -af --volumes || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler flex g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone pbs05/ponwrt
        run: |
          git clone --depth=1 https://github.com/pbs05/ponwrt.git ponwrt
          rm -rf ponwrt/.git
          ls -la ponwrt/configs || true

      - name: Update and install feeds
        run: |
          cd ponwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          df -h

      - name: Apply an7583.config with Chinese and built-in Argon theme
        run: |
          cd ponwrt
          if [ -f configs/an7583.config ]; then
            cp configs/an7583.config .config
          else
            echo "Warning: configs/an7583.config not found, fallback to an7581.config"
            cp configs/an7581.config .config
          fi
          cat << 'EOF' >> .config
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y
          CONFIG_PACKAGE_rpcd=y
          CONFIG_PACKAGE_rpcd-mod-luci=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          EOF
          make defconfig

          mkdir -p files/etc/uci-defaults
          cat << 'EOF' > files/etc/uci-defaults/99-custom-luci
          uci set luci.main.lang='zh_cn'
          uci set luci.main.mediaurlbase='/luci-static/argon'
          uci commit luci
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-custom-luci

      - name: Download sources and compile firmware
        run: |
          cd ponwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \; || true
          make -j$(nproc) || make -j1 V=s
          rm -rf dl/*
          find bin/targets -maxdepth 4 -type f || true
          df -h

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-an7583-xg-040g-mf
          path: ponwrt/bin/targets/airoha/an7583/*
          if-no-files-found: warn

      - name: Release firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: an7583-mf-v${{ github.run_number }}
          name: PonWrt AN7583 (XG-040G-MF) Build #${{ github.run_number }}
          files: |
            ponwrt/bin/targets/airoha/an7583/*-sysupgrade.bin
            ponwrt/bin/targets/airoha/an7583/*.itb
            ponwrt/bin/targets/airoha/an7583/sha256sums
          fail_on_unmatched_files: false
